version: 2
updates:
  # agora cada serviço tem o seu requirements.txt e o seu Dockerfile
  - package-ecosystem: pip
    directories: [/servicos/usuarios, /servicos/inventario, /servicos/chamados, /servicos/notificacoes, /gateway]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/servicos/usuarios, /servicos/inventario, /servicos/chamados, /servicos/notificacoes, /gateway]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
